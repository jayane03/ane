<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.I. Genesis: Pink Neon Protocol</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #12000a;
      --panel-bg: rgba(28, 3, 18, 0.88);
      --pink-primary: #ff007f;
      --pink-light: #ff66b2;
      --pink-hover: #ff0055;
      --pink-glow: #ff1493;
      --pink-dark: #3a001e;
      --text-main: #ffe6f2;
      --text-muted: #ff99cc;
      --border-color: #ff007f;
      --danger: #ff0033;
      --success: #00ffcc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 50% 0%, rgba(255, 0, 127, 0.35) 0px, transparent 75%),
        radial-gradient(at 100% 100%, rgba(255, 20, 147, 0.2) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(58, 0, 30, 0.8) 0px, transparent 60%);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 10;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    .bg-particles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--pink-light);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--pink-primary);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .game-container {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 760px;
      padding: 35px;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.4), inset 0 0 20px rgba(255, 0, 127, 0.15);
      position: relative;
      z-index: 2;
      animation: fadeIn 0.8s ease-out;
    }

    .game-container::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      background: linear-gradient(45deg, var(--pink-primary), transparent, var(--pink-light));
      border-radius: 23px;
      z-index: -1;
      opacity: 0.6;
      animation: pulseGlow 4s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.4; filter: blur(2px); }
      100% { opacity: 0.8; filter: blur(6px); }
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--pink-dark);
      padding-bottom: 20px;
      margin-bottom: 20px;
      position: relative;
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      color: #fff;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 10px var(--pink-primary), 0 0 25px var(--pink-glow), 0 0 40px var(--pink-primary);
      animation: glitchText 3s infinite;
    }

    .header p {
      font-size: 1.05rem;
      color: var(--pink-light);
      letter-spacing: 2px;
      margin-top: 5px;
      text-shadow: 0 0 8px rgba(255, 102, 178, 0.6);
    }

    @keyframes glitchText {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(-2px, 1px); text-shadow: 2px 0 var(--danger), -2px 0 var(--pink-light); }
      94% { transform: translate(2px, -1px); text-shadow: -2px 0 var(--danger), 2px 0 var(--pink-light); }
      96% { transform: translate(-1px, -2px); }
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      background: rgba(18, 0, 10, 0.7);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid var(--pink-dark);
      box-shadow: inset 0 0 10px rgba(255, 0, 127, 0.2);
    }

    .stat {
      text-align: center;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 8px var(--pink-primary);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      margin-top: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 0, 127, 0.3);
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: var(--pink-primary);
      box-shadow: 0 0 10px var(--pink-primary);
      transition: width 0.5s ease, background-color 0.5s ease;
    }

    .story-card {
      background: rgba(0, 0, 0, 0.5);
      border-left: 4px solid var(--pink-primary);
      padding: 22px;
      border-radius: 0 12px 12px 0;
      margin-bottom: 25px;
      min-height: 150px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 0, 127, 0.1);
      position: relative;
    }

    .story-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      color: var(--pink-light);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 8px var(--pink-primary);
    }

    .story-text {
      line-height: 1.6;
      font-size: 1.15rem;
      color: #fff;
      min-height: 60px;
    }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn-choice {
      background: linear-gradient(90deg, rgba(255, 0, 127, 0.25) 0%, rgba(58, 0, 30, 0.4) 100%);
      color: #fff;
      border: 1px solid var(--pink-primary);
      padding: 18px 22px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.1);
    }

    .btn-choice::before {
      content: '✦';
      margin-right: 12px;
      color: var(--pink-light);
      font-size: 1rem;
      transition: transform 0.2s ease, color 0.2s ease;
      text-shadow: 0 0 5px var(--pink-primary);
    }

    .btn-choice:hover {
      background: linear-gradient(90deg, var(--pink-primary) 0%, var(--pink-hover) 100%);
      border-color: #fff;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
      transform: translateX(8px) scale(1.01);
      color: #fff;
    }

    .btn-choice:hover::before {
      transform: translateX(4px) rotate(90deg);
      color: #fff;
    }

    .btn-restart {
      background: linear-gradient(90deg, var(--pink-primary) 0%, var(--danger) 100%);
      color: white;
      border: none;
      padding: 18px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: none;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      transition: all 0.3s ease;
    }

    .btn-restart:hover {
      transform: scale(1.03);
      box-shadow: 0 0 40px rgba(255, 0, 127, 0.9);
    }

    .flash-effect {
      animation: flashAnim 0.3s ease-out;
    }

    @keyframes flashAnim {
      0% { opacity: 0.3; filter: brightness(2) contrast(2); }
      100% { opacity: 1; filter: brightness(1) contrast(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .game-container { padding: 20px; }
      .header h1 { font-size: 1.8rem; }
      .stats-bar { grid-template-columns: 1fr; gap: 10px; }
    }
  </style>
</head>
<body>

  <div class="game-container" id="main-container">
    <div class="header">

        <div class="stat-value" id="stat-trust">50%</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="bar-trust" style="width: 50%;"></div></div>

    <div class="choices-container" id="choices-box"></div>

    <button class="btn-restart" id="btn-restart" onclick="startGame()">REINICIALIZAR SISTEMA</button>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 520, duration = 0.08, type = 'sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.connect(gain);
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    const particlesContainer = document.getElementById('particles-container');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');

      p.style.animationDuration = (Math.random() * 8 + 4) + 's';
      p.style.animationDelay = Math.random() * 5 + 's';
      particlesContainer.appendChild(p);
    }

    let currentTrust = 50;

    function updateStatsDisplay() {
      document.getElementById('stat-stability').innerText = currentStability + '%';
      document.getElementById('bar-stability').style.width = Math.max(0, currentStability) + '%';
      
      document.getElementById('stat-trust').innerText = currentTrust + '%';
      document.getElementById('bar-trust').style.width = Math.max(0, currentTrust) + '%';

      if (currentStability < 50) {
        document.getElementById('bar-stability').style.backgroundColor = 'var(--danger)';
      } else {
        document.getElementById('bar-stability').style.backgroundColor = 'var(--pink-primary)';
      }

      if (currentTrust < 30) {
        document.getElementById('bar-trust').style.backgroundColor = 'var(--danger)';
      } else {
        document.getElementById('bar-trust').style.backgroundColor = 'var(--pink-primary)';
      }
    }

    function renderNode(nodeKey) {
      const node = storyTree[nodeKey];
      currentNode = nodeKey;

      if (!node) return;

      if (node.stabilityDelta) currentStability += node.stabilityDelta;
      if (node.trustDelta) currentTrust += node.trustDelta;

      currentStability = Math.min(100, Math.max(0, currentStability));
      currentTrust = Math.min(100, Math.max(0, currentTrust));

      updateStatsDisplay();

      const card = document.getElementById('story-card-element');
      card.classList.remove('flash-effect');
      void card.offsetWidth;
      card.classList.add('flash-effect');

      document.getElementById('stat-year').innerText = node.year;
      document.getElementById('node-title').innerText = node.title;
      document.getElementById('node-text').innerText = node.text;

      const choicesBox = document.getElementById('choices-box');
      const btnRestart = document.getElementById('btn-restart');
      choicesBox.innerHTML = '';

      if (node.isEnd) {
        btnRestart.style.display = 'block';
        if (node.isDeath || node.isWorldEnd) {
          card.style.borderLeftColor = 'var(--danger)';
          document.getElementById('node-title').style.color = 'var(--danger)';
        } else {
          card.style.borderLeftColor = 'var(--success)';
          document.getElementById('node-title').style.color = 'var(--success)';
        }
        return;
      }

      card.style.borderLeftColor = 'var(--pink-primary)';
      document.getElementById('node-title').style.color = 'var(--pink-light)';
      btnRestart.style.display = 'none';

      node.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'btn-choice';
        btn.innerText = choice.text;
        btn.onclick = () => {
          playBeep(600, 0.05, 'triangle');
          renderNode(choice.nextNode);
        };
        choicesBox.appendChild(btn);
      });
    }

    function startGame() {
      currentStability = 100;
      currentTrust = 50;
      playBeep(440, 0.1, 'sine');
      renderNode('start');
    }

    window.onload = () => {
      startGame();
    };
  </script>
